<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bellaterra Conecta — Cinco puertas, un mismo lugar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>


<div class="hero-wrap">
  <header class="site-nav hero-nav">
    <a class="brand" href="index.html"><img src="assets/logo-mark-white.png" alt="Bellaterra Conecta"></a>
    <nav class="nav-links">
      <a href="index.html" aria-current="page">Inicio</a>
      <a href="vision.html">Nuestra Visión</a>
      <a href="sostenibilidad.html">Sostenibilidad</a>
    </nav>
  </header>

  <section class="hero-full">
    <div class="hero-backdrop" id="hero-backdrop" style="background-image:url('assets/general/aerea-hd.jpg')"></div>
    <img id="hero-img" class="hero-frame-img" src="assets/general/aerea-hd.jpg" alt="Vista aérea real de la finca Bellaterra Conecta: pistas de pickleball, edificio principal y piscina">
    <div id="doors-layer"></div>
    <div class="hero-scrim" aria-hidden="true"></div>

    <div class="hero-caption">
      <h1><span>No es una finca.</span><br><span>Es todo lo que ocurre dentro de ella.</span></h1>
      <p class="hero-caption-tagline"><span>Cinco formas de entrar. Un único lugar donde todo conecta.</span></p>
    </div>
  </section>
</div>

<script src="doors-data.js"></script>
<script src="transition.js"></script>
<script>
(function () {
  const layer = document.getElementById("doors-layer");
  const heroImg = document.getElementById("hero-img");

  // El hero ocupa toda la pantalla, sin franjas a los lados. La imagen
  // aérea tiene proporción fija (16/9.06); las 5 puertas viven todas
  // en la franja central vertical (30%-58% de alto), así que en
  // pantallas iguales o más anchas que la imagen (la inmensa mayoría:
  // portátiles, monitores) rellenamos ancho Y alto recortando solo
  // arriba/abajo — nunca se pierde ninguna puerta porque ese recorte
  // no toca esa franja central. Solo en móvil vertical, donde SÍ se
  // recortarían puertas por los lados (Party, Business...), volvemos
  // a mostrar la imagen completa centrada (con el fondo desenfocado
  // rellenando arriba/abajo) para no perder ningún punto.
  function syncDoorsLayer() {
    const iw = heroImg.naturalWidth, ih = heroImg.naturalHeight;
    if (!iw || !ih) return;
    const cw = heroImg.clientWidth, ch = heroImg.clientHeight;
    const containerRatio = cw / ch, imageRatio = iw / ih;
    let renderW, renderH, offsetX, offsetY, visibleH;

    if (containerRatio >= imageRatio) {
      heroImg.style.objectFit = "cover";
      const scale = cw / iw;
      renderW = iw * scale;
      renderH = ih * scale;
      offsetX = 0;
      offsetY = (ch - renderH) / 2;
      visibleH = ch;
    } else {
      heroImg.style.objectFit = "contain";
      renderW = cw;
      renderH = cw / imageRatio;
      offsetX = 0;
      offsetY = (ch - renderH) / 2;
      visibleH = renderH;
    }

    layer.style.left = offsetX + "px";
    layer.style.top = offsetY + "px";
    layer.style.width = renderW + "px";
    layer.style.height = renderH + "px";

    // En móvil vertical la franja de imagen visible es más baja, así
    // que las pastillas se encogen proporcionalmente para caber sin
    // solaparse. 850px ~= alto visible típico de escritorio.
    const escala = Math.max(0.55, Math.min(1, visibleH / 850));
    layer.style.setProperty("--pill-scale", escala.toFixed(3));
  }

  BC_DOORS.forEach((door) => {
    const dot = document.createElement("div");
    dot.className = "door-dot";
    dot.dataset.doorId = door.id;
    dot.style.left = door.xPct;
    dot.style.top = door.yPct;
    dot.style.background = door.accent;
    dot.style.animationDelay = door.wiggleDelay + "s";
    layer.appendChild(dot);

    // <a> real con href — funciona sin JS (crawlers, clic derecho,
    // abrir en pestaña nueva) y además dispara la animación cuando sí
    // hay JS y es un clic normal.
    const pill = document.createElement("a");
    pill.className = "door-pill";
    pill.dataset.doorId = door.id;
    pill.href = door.id + ".html";
    pill.setAttribute("aria-label", `${door.name}: ${door.tagline}`);
    pill.style.left = door.pillX;
    pill.style.top = door.pillY;
    pill.style.animationDelay = door.wiggleDelay + "s";
    pill.innerHTML = `
      <span class="mono" style="background:${door.accent}">${door.mono}</span>
      <span>
        <span class="nombre">${door.name}</span>
        <span class="tagline">${door.tagline}</span>
      </span>
    `;
    pill.addEventListener("click", (e) => {
      // Deja pasar clic central/con modificador (abrir en pestaña nueva, etc.)
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      // Origen del zoom = donde ha tocado/clicado realmente el usuario,
      // no el centro del punto — se siente más preciso y fluido.
      const rect = dot.getBoundingClientRect();
      const dentroDelPunto = e.clientX >= rect.left - 4 && e.clientX <= rect.right + 4 && e.clientY >= rect.top - 4 && e.clientY <= rect.bottom + 4;
      const x = dentroDelPunto ? e.clientX : rect.left + rect.width / 2;
      const y = dentroDelPunto ? e.clientY : rect.top + rect.height / 2;
      BCTransition.zoomInto({
        x, y,
        color: door.accent,
        image: door.heroImage,
        href: door.id + ".html",
      });
    });
    layer.appendChild(pill);
  });

  // Precarga en segundo plano las 5 fotos de portada de las puertas,
  // así al hacer clic la imagen ya está descargada/decodificada y el
  // fundido no da un tirón a medio camino.
  BC_DOORS.forEach((door) => { const im = new Image(); im.src = door.heroImage; });

  if (heroImg.complete) syncDoorsLayer();
  else heroImg.addEventListener("load", syncDoorsLayer);
  window.addEventListener("resize", syncDoorsLayer);
  window.addEventListener("orientationchange", syncDoorsLayer);

  // Si venimos de "volver" desde una puerta, cierra el zoom hacia ese
  // punto exacto en vez de cargar la página de golpe.
  BCTransition.revealHomeOnLoad();
})();
</script>
</body>
</html>
